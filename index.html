<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Junction — LifeatJNTUH Design System</title>
    <meta
      name="description"
      content="Junction: the shared design system powering the digital products and experiences built by LifeatJNTUH."
    />

    <!-- Fonts: Inter (body/UI), Lexend (display/headings), JetBrains Mono (code/data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Icons: Junction uses Iconify's Solar icon set (<iconify-icon icon="solar:...">)
      throughout the product, not lucide-react. lucide-react stays in devDependencies only
      because shadcn's CLI requires an iconLibrary value — see components.json.
    -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
